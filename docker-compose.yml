# Serviços locais (desenvolvimento-local.md). MinIO, ElasticMQ e Mailpit entram quando os spikes precisarem.
services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: trippy
      POSTGRES_PASSWORD: trippy
      POSTGRES_DB: trippy
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trippy']
      interval: 5s
      retries: 10
