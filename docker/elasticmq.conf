include classpath("application.conf")

node-address {
  protocol = "http"
  host = "localhost"
  port = 59324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/storage"
}

queues {
  "trippy-thumbs" {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "trippy-thumbs-dlq"
      maxReceiveCount = 5
    }
  }
  "trippy-thumbs-dlq" { }

  "trippy-recap" {
    defaultVisibilityTimeout = 300 seconds
    deadLettersQueue {
      name = "trippy-recap-dlq"
      maxReceiveCount = 5
    }
  }
  "trippy-recap-dlq" { }
}
