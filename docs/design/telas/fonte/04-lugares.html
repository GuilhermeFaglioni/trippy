<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="font-weight: 700; font-size: 15px">{{p.name}}</div>
<div style="font-size: 13px; color: #5E6660; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.by}}</div>
<button style="align-self: flex-start; min-height: 32px; border: 0; font: 700 12px 'DM Sans', sans-serif; padding: 3px 10px; border-radius: 999px; background: {{p.statusBg}}; color: {{p.statusFg}}">{{p.status}}</button>
</div>
<button aria-label="Quero ir, {{p.want}}" aria-pressed="{{p.on}}" style="min-width: 52px; height: 52px; border-radius: 12px; border: {{p.wantBorder}}; background: {{p.wantBg}}; color: {{p.wantFg}}; font: 700 13px 'DM Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="{{p.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"></path></svg>{{p.want}}</button>
