<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F1EA; color: #1B1F1D; font-family: 'DM Sans', sans-serif; display: flex; flex-direction: column; padding: 56px 20px 32px; gap: 14px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center">
<button style="height: 44px; border: 0; background: transparent; font: 500 16px 'DM Sans', sans-serif; color: #1B1F1D; padding: 0">Cancelar</button>
<span style="font-size: 13px; color: #5E6660">12 fotos selecionadas</span>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.8px">Confira os lugares</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5E6660">Sugerimos o lugar de cada foto pela hora em que foi tirada. Toque para corrigir.</p>
<sc-for each="{{groups}}" as="g">
<div style="background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 15px">{{g.place}}</div>
<div style="font-size: 12px; color: #5E6660">{{g.meta}}</div>
</div>
<button style="min-height: 44px; padding: 0 12px; border: 1px solid #8C8378; border-radius: 12px; background: #FFFFFF; color: #1B1F1D; font: 700 13px 'DM Sans', sans-serif">{{g.action}}</button>
</div>
<div style="display: flex; gap: 4px">
<div style="flex: 1; height: 64px; border-radius: 8px; background: #B9C8BF"></div>
<div style="flex: 1; height: 64px; border-radius: 8px; background: #D8C3A0"></div>
<div style="flex: 1; height: 64px; border-radius: 8px; background: #A8B3AD"></div>
<div style="flex: 1; height: 64px; border-radius: 8px; background: #CBBBA6; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{g.more}}</div>
</div>
</div>
</sc-for>
<div style="flex: 1"></div>
<div style="font-size: 13px; color: #5E6660; text-align: center">Sem internet? As fotos ficam na fila e sobem sozinhas.</div>
<button style="height: 56px; border: 0; border-radius: 18px; background: #C2410C; color: #FFFFFF; font: 700 16px 'DM Sans', sans-serif">Enviar 12 fotos</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() { return { groups: [
{ place: 'Yu Garden', meta: 'Sugerido · 14h05–14h40', action: 'Trocar', more: '+3' },
{ place: 'The Bund ao anoitecer', meta: 'Sugerido · 18h20–19h10', action: 'Trocar', more: '+2' },
{ place: 'Sem lugar', meta: '2 fotos · 16h30, nenhum lugar no horário', action: 'Escolher', more: '' }
] }; }
}
</script>
