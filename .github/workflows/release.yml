name: Release

# Checks pesados. Obrigatórios nos PRs develop -> main (release).
# No develop: só com o label "ios" e no build noturno (schedule roda no branch padrão, o develop).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source:
    name: Origem do PR de release
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: A main só recebe PRs vindos do develop
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::PRs para a main precisam vir do branch develop deste repositório (veio de $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi

  ios-simulator:
    name: Build iOS (Simulator)
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref == 'main' ||
      contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar projeto nativo (Expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Build para o Simulator
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Trippy.xcworkspace \
            -scheme Trippy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Empacotar .app
        run: |
          set -euo pipefail
          APP_DIR=apps/mobile/ios/build/Build/Products/Debug-iphonesimulator
          tar -C "$APP_DIR" -czf trippy-ios-simulator.app.tar.gz Trippy.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trippy-ios-simulator-${{ github.sha }}
          path: trippy-ios-simulator.app.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Próximos jobs deste workflow, conforme forem existindo:
  # - e2e-maestro: fluxos do fluxos-e-telas.md no Simulator, usando o .app acima
  # - render-image: build linux/amd64 do worker Remotion + render curto de fumaça
  # - testflight (após merge na main, com Environment "release" e aprovação manual)
