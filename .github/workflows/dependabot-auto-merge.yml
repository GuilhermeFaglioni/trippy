name: Dependabot auto-merge

# Liga o auto-merge (squash) nos PRs do Dependabot de patch e minor.
# Atualizações de GitHub Actions ficam de fora: o GITHUB_TOKEN não pode fazer merge de mudanças em .github/workflows.
# O merge só acontece depois que os checks obrigatórios do branch passam. Majors ficam para revisão manual.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Habilitar auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'GuilhermeFaglioni/trippy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Auto-merge de patch e minor
        if: >-
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
