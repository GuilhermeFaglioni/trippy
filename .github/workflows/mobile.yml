name: Mobile

# Runner macOS é lento; roda na main, toda noite e em PRs com o label "ios".
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Build iOS (Simulator)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar projeto nativo (Expo prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      - name: Build para o Simulator
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Trippy.xcworkspace \
            -scheme Trippy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Empacotar .app
        run: |
          set -euo pipefail
          APP_DIR=apps/mobile/ios/build/Build/Products/Debug-iphonesimulator
          tar -C "$APP_DIR" -czf trippy-ios-simulator.app.tar.gz Trippy.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trippy-ios-simulator-${{ github.sha }}
          path: trippy-ios-simulator.app.tar.gz
          if-no-files-found: error
          retention-days: 7
