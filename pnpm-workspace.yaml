packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16

# Exceções da auditoria. Revisar quando o Dependabot trouxer versão corrigida.
# Ambas são transitivas das ferramentas de desenvolvimento do Expo (CLI e Metro), sem correção publicada
# em 19/out/2026, e não vão para o app nem para a API.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge, via @expo/code-signing-certificates
    - GHSA-vfj7-8cjw-p6xm # braces, via metro > micromatch
