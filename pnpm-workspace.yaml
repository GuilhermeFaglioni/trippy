  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
  - '@aws-sdk/checksums@3.1001.4'
  - '@aws-sdk/client-s3@3.1153.0'
  - '@aws-sdk/client-sqs@3.1153.0'
  - '@aws-sdk/core@3.978.4'
  - '@aws-sdk/credential-provider-env@3.972.75'
  - '@aws-sdk/credential-provider-http@3.972.77'
