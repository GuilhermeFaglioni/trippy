appId: app.trippy.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- evalScript: ${output.email = 'maestro-lugar-' + Date.now() + '-' + Math.floor(Math.random() * 1000000) + '@example.test'}
- tapOn:
    id: login-email-input
- inputText: ${output.email}
- tapOn:
    id: login-email-submit
- assertVisible:
    id: login-code-input
- runScript:
    file: scripts/codigo-mailpit.js
    env:
      EMAIL: ${output.email}
- tapOn:
    id: login-code-input
- inputText: ${output.codigo}
- pressKey: enter
- assertVisible:
    id: my-trips-screen
- tapOn:
    id: my-trips-empty-create
- evalScript: ${output.tripName = 'Viagem de busca ' + Date.now() + '-' + Math.floor(Math.random() * 1000000)}
- evalScript: ${output.startDate = new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toLocaleDateString('pt-BR')}
- evalScript: ${output.endDate = new Date(Date.now() + 63 * 24 * 60 * 60 * 1000).toLocaleDateString('pt-BR')}
- tapOn:
    id: new-trip-name
- inputText: ${output.tripName}
- tapOn:
    id: new-trip-destination
- inputText: Rio de Janeiro
- tapOn:
    id: new-trip-start-date
- inputText: ${output.startDate}
- tapOn:
    id: trippy-wordmark
- tapOn:
    id: new-trip-end-date
- inputText: ${output.endDate}
- tapOn:
    id: trippy-wordmark
- tapOn:
    id: new-trip-submit
- assertVisible: ${output.tripName}
- tapOn: ${output.tripName}
- assertVisible:
    id: trip-detail-screen
- tapOn:
    id: add-place-button
- assertVisible:
    id: add-place-screen
- tapOn:
    id: place-search-query
- inputText: Museu do Amanhã
- pressKey: enter
- assertVisible:
    id: place-candidate-0
- tapOn:
    id: place-candidate-0
- tapOn:
    id: place-submit
- assertVisible:
    id: trip-detail-screen
- assertVisible: Powered by Geoapify
- assertVisible: © OpenStreetMap contributors
