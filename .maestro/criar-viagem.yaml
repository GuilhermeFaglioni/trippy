appId: app.trippy.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- evalScript: ${output.email = 'maestro-' + Date.now() + '-' + Math.floor(Math.random() * 1000000) + '@example.test'}
- tapOn:
    id: login-use-email
- tapOn:
    id: login-email-input
- inputText: ${output.email}
- tapOn:
    id: login-email-submit
- assertVisible:
    id: login-code-input
- runScript:
    file: scripts/codigo-mailpit.js
    env:
      EMAIL: ${output.email}
- tapOn:
    id: login-code-input
- inputText: ${output.codigo}
- pressKey: enter
- assertVisible:
    id: my-trips-screen
- assertVisible:
    id: my-trips-empty-create
- tapOn:
    id: my-trips-empty-create
- assertVisible: Pra onde vocês vão?
- evalScript: ${output.tripName = 'Viagem Maestro ' + Date.now() + '-' + Math.floor(Math.random() * 1000000)}
- evalScript: ${output.startDate = new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toLocaleDateString('pt-BR')}
- evalScript: ${output.endDate = new Date(Date.now() + 63 * 24 * 60 * 60 * 1000).toLocaleDateString('pt-BR')}
- tapOn:
    id: new-trip-name
- inputText: ${output.tripName}
- tapOn:
    id: new-trip-destination
- inputText: Recife
- hideKeyboard
- tapOn:
    id: new-trip-start-date
- inputText: ${output.startDate}
- hideKeyboard
- tapOn:
    id: new-trip-end-date
- inputText: ${output.endDate}
- hideKeyboard
- tapOn:
    id: new-trip-submit
- assertVisible:
    id: my-trips-screen
- assertVisible: Viagem Maestro.*
- assertVisible: PLANEJANDO
