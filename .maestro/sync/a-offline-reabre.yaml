appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/alternar-offline.yaml
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-lugares
- runFlow:
    file: ../subflows/sugerir-lugar.yaml
    env:
      PLACE_NAME: ${PLACE_NAME}
      PLACE_SLUG: ${PLACE_SLUG}
# "Eu fui" na tela do lugar.
- tapOn:
    id: place-${PLACE_SLUG}
- tapOn:
    id: lugar-fui
- assertVisible:
    id: lugar-visita-voce
- tapOn:
    id: lugar-voltar
- stopApp
- launchApp:
    clearState: false
- assertVisible:
    id: my-trips-screen
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-lugares
- tapOn:
    id: place-${PLACE_SLUG}
- assertVisible:
    id: lugar-visita-voce
