appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/alternar-offline.yaml
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-roteiro
- extendedWaitUntil:
    visible:
      id: roteiro-lugar-${PLACE_1_SLUG}
    timeout: 30000
# Segura o primeiro lugar e arrasta até o fim do dia (o excesso de arraste é limitado à última posição).
- swipe:
    from:
      id: roteiro-lugar-${PLACE_1_SLUG}
    direction: DOWN
    duration: 1500
- assertVisible:
    id: roteiro-lugar-${PLACE_1_SLUG}
