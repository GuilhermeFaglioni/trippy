appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/alternar-offline.yaml
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-roteiro
- extendedWaitUntil:
    visible:
      id: roteiro-lugar-${PLACE_1_SLUG}
    timeout: 30000
# Segurar e arrastar não é alcançável pelo Maestro (o swipe do iOS não segura antes de arrastar);
# o mesmo roteiro diverge pelo ícone de mover de dia da linha, que abre a folha de dias.
- tapOn:
    id: roteiro-lugar-${PLACE_1_SLUG}-mover-dia
- tapOn: 'Dia 2 · .*'
- extendedWaitUntil:
    notVisible:
      id: roteiro-lugar-${PLACE_1_SLUG}
    timeout: 15000
- assertVisible:
    id: roteiro-lugar-${PLACE_2_SLUG}
