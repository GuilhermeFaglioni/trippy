appId: app.trippy.mobile
---
- launchApp:
    clearKeychain: true
- openLink: ${DEV_CLIENT_URL}
- tapOn:
    text: Abrir
    optional: true
- extendedWaitUntil:
    visible: Go home
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: Go home
    commands:
      - tapOn:
          point: 91%,48%
- extendedWaitUntil:
    visible:
      id: login-use-email
    timeout: 30000
- tapOn:
    id: login-use-email
- tapOn:
    id: login-email-input
- inputText: ${A_EMAIL}
- tapOn:
    id: login-email-submit
- assertVisible:
    id: login-code-input
- runScript:
    file: ../scripts/codigo-mailpit.js
    env:
      EMAIL: ${A_EMAIL}
- tapOn:
    id: login-code-input
- inputText: ${output.codigo}
- pressKey: enter
- assertVisible:
    id: my-trips-screen
- tapOn:
    id: my-trips-empty-create
- assertVisible: Pra onde vocês vão?
- evalScript: ${output.startDate = new Date(Date.now() + 60 * 24 * 60 * 60 * 1000).toLocaleDateString('pt-BR')}
- evalScript: ${output.endDate = new Date(Date.now() + 63 * 24 * 60 * 60 * 1000).toLocaleDateString('pt-BR')}
- tapOn:
    id: new-trip-name
- inputText: ${TRIP_NAME}
- tapOn:
    id: new-trip-destination
- inputText: Recife
- tapOn: Pra onde vocês vão?
- tapOn:
    id: new-trip-start-date
- inputText: ${output.startDate}
- tapOn: Pra onde vocês vão?
- tapOn:
    id: new-trip-end-date
- inputText: ${output.endDate}
- tapOn: Pra onde vocês vão?
- tapOn:
    id: new-trip-submit
- assertVisible: '.*${TRIP_NAME}.*'
- tapOn: '.*${TRIP_NAME}.*'
- assertVisible:
    id: trip-detail-screen
- retry:
    maxRetries: 3
    commands:
      - scrollUntilVisible:
          element:
            id: create-trip-invite
          direction: UP
          timeout: 4000
          optional: true
      - scrollUntilVisible:
          element:
            id: create-trip-invite
          direction: DOWN
      - tapOn:
          id: create-trip-invite
      - scrollUntilVisible:
          element:
            id: invite-code-value
          direction: DOWN
          timeout: 8000
- copyTextFrom:
    id: invite-code-value
- evalScript: ${console.log('INVITE_TOKEN=' + maestro.copiedText)}
