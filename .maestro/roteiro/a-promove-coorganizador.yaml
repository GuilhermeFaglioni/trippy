appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-grupo
- extendedWaitUntil:
    visible:
      id: grupo-membro-${B_USER_ID}-opcoes
    timeout: 60000
- tapOn:
    id: grupo-membro-${B_USER_ID}-opcoes
- tapOn:
    id: grupo-membro-${B_USER_ID}-promover
- extendedWaitUntil:
    visible:
      text: 'Coorganizador.*'
    timeout: 15000
