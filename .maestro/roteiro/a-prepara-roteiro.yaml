appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-lugares
- runFlow:
    file: ../subflows/sugerir-lugar.yaml
    env:
      PLACE_NAME: ${PLACE_1}
      PLACE_SLUG: ${PLACE_1_SLUG}
- runFlow:
    file: ../subflows/sugerir-lugar.yaml
    env:
      PLACE_NAME: ${PLACE_2}
      PLACE_SLUG: ${PLACE_2_SLUG}
- runFlow:
    file: ../subflows/sugerir-lugar.yaml
    env:
      PLACE_NAME: ${PLACE_3}
      PLACE_SLUG: ${PLACE_3_SLUG}
- tapOn:
    id: trip-tab-roteiro
- assertVisible:
    id: tela-roteiro
- runFlow:
    file: ../subflows/por-no-dia.yaml
    env:
      DIA_INDICE: '0'
      PLACE_NAME: ${PLACE_1}
      PLACE_SLUG: ${PLACE_1_SLUG}
- runFlow:
    file: ../subflows/por-no-dia.yaml
    env:
      DIA_INDICE: '0'
      PLACE_NAME: ${PLACE_2}
      PLACE_SLUG: ${PLACE_2_SLUG}
- runFlow:
    file: ../subflows/por-no-dia.yaml
    env:
      DIA_INDICE: '0'
      PLACE_NAME: ${PLACE_3}
      PLACE_SLUG: ${PLACE_3_SLUG}
