appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/alternar-offline.yaml
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-roteiro
- scrollUntilVisible:
    element:
      id: conflito-roteiro-rascunho-${PLACE_3_SLUG}
    direction: DOWN
- assertVisible:
    id: conflito-roteiro
- assertVisible:
    id: conflito-roteiro-rascunho-${PLACE_3_SLUG}
- scrollUntilVisible:
    element:
      id: conflito-roteiro-atual-${PLACE_2_SLUG}
    direction: DOWN
- assertVisible:
    id: conflito-roteiro-atual-${PLACE_2_SLUG}
- assertVisible: Seu rascunho
- assertVisible: Roteiro atual
- scrollUntilVisible:
    element:
      text: Aplicar meu rascunho de novo
    direction: DOWN
- tapOn: Aplicar meu rascunho de novo
- assertNotVisible:
    id: conflito-roteiro
- assertVisible:
    id: roteiro-lugar-${PLACE_1_SLUG}
