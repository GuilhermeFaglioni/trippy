appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- openLink: trippy:///diagnostics
- tapOn:
    text: Abrir
    optional: true
- assertVisible:
    id: simulate-offline-toggle
- tapOn:
    id: simulate-offline-toggle
- openLink: trippy:///trips/${TRIP_ID}
- tapOn:
    text: Abrir
    optional: true
- assertVisible:
    id: viagem-abas
- tapOn:
    id: trip-tab-lugares
- tapOn:
    id: add-place-button
- tapOn:
    id: place-search-query
- inputText: ${PLACE_PENDENTE}
- hideKeyboard
- tapOn:
    id: save-typed-place
- assertVisible:
    id: viagem-abas
- scrollUntilVisible:
    element:
      id: trip-sync-status
    direction: DOWN
- assertVisible: 1 pendentes
