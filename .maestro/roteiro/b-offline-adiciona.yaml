appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/alternar-offline.yaml
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-lugares
- runFlow:
    file: ../subflows/sugerir-lugar.yaml
    env:
      PLACE_NAME: ${PLACE_PENDENTE}
      PLACE_SLUG: ${PLACE_PENDENTE_SLUG}
