appId: app.trippy.mobile
---
- launchApp:
    clearKeychain: true
- openLink: ${DEV_CLIENT_URL}
- tapOn:
    text: Abrir
    optional: true
- extendedWaitUntil:
    visible: Go home
    timeout: 90000
    optional: true
- tapOn:
    point: 91%,48%
    optional: true
- extendedWaitUntil:
    visible:
      id: login-email-input
    timeout: 120000
- tapOn:
    id: login-email-input
- inputText: ${B_EMAIL}
- tapOn:
    id: login-email-submit
- assertVisible:
    id: login-code-input
- runScript:
    file: ../scripts/codigo-mailpit.js
    env:
      EMAIL: ${B_EMAIL}
- tapOn:
    id: login-code-input
- inputText: ${output.codigo}
- pressKey: enter
- assertVisible:
    id: my-trips-screen
- tapOn:
    id: accept-invite-code
- inputText: ${INVITE_CODE}
- hideKeyboard
- tapOn:
    id: accept-invite-button
- scrollUntilVisible:
    element:
      id: accept-invite-terms-accept
    direction: DOWN
- tapOn:
    id: accept-invite-terms-accept
- assertVisible:
    id: trip-detail-screen
- assertVisible: ${TRIP_NAME}
