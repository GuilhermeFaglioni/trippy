appId: app.trippy.mobile
---
- launchApp:
    clearKeychain: true
- openLink: ${DEV_CLIENT_URL}
- tapOn:
    text: Abrir
    optional: true
- extendedWaitUntil:
    visible: Go home
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: Go home
    commands:
      - tapOn:
          point: 91%,48%
- extendedWaitUntil:
    visible:
      id: login-use-email
    timeout: 120000
- tapOn:
    id: login-use-email
- tapOn:
    id: login-email-input
- inputText: ${B_EMAIL}
- tapOn:
    id: login-email-submit
- assertVisible:
    id: login-code-input
- runScript:
    file: ../scripts/codigo-mailpit.js
    env:
      EMAIL: ${B_EMAIL}
- tapOn:
    id: login-code-input
- inputText: ${output.codigo}
- pressKey: enter
- assertVisible:
    id: my-trips-screen
- tapOn:
    id: my-trips-show-invite
- tapOn:
    id: accept-invite-code
- inputText: ${INVITE_CODE}
- tapOn: Sua primeira viagem começa aqui
- tapOn:
    id: accept-invite-button
- scrollUntilVisible:
    element:
      id: accept-invite-terms-accept
    direction: DOWN
- tapOn:
    id: accept-invite-terms-accept
- extendedWaitUntil:
    visible:
      id: trip-tab-lugares
    timeout: 60000
