appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- retry:
    maxRetries: 4
    commands:
      - tapOn:
          id: trip-tab-grupo
      - extendedWaitUntil:
          visible:
            id: grupo-membro-${B_USER_ID}-opcoes
          timeout: 25000
- tapOn:
    id: grupo-membro-${B_USER_ID}-opcoes
- tapOn:
    id: grupo-membro-${B_USER_ID}-remover
- extendedWaitUntil:
    notVisible:
      id: grupo-membro-${B_USER_ID}
    timeout: 15000
