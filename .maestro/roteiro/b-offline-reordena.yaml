# Mesma divergência de A, em outro lugar: B manda o último lugar do dia 1 para o dia 2.
- tapOn:
    id: roteiro-lugar-${PLACE_3_SLUG}-mover-dia
- tapOn: 'Dia 2 · .*'
- extendedWaitUntil:
    notVisible:
      id: roteiro-lugar-${PLACE_3_SLUG}
    timeout: 15000
- assertVisible:
    id: roteiro-lugar-${PLACE_1_SLUG}
