appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-grupo
- extendedWaitUntil:
    visible:
      text: 'Coorganizador.*'
    timeout: 60000
- runFlow:
    file: ../subflows/alternar-offline.yaml
- runFlow:
    file: ../subflows/abrir-viagem.yaml
- tapOn:
    id: trip-tab-roteiro
- extendedWaitUntil:
    visible:
      id: roteiro-lugar-${PLACE_3_SLUG}
    timeout: 30000
# Segura o último lugar e arrasta até o topo do dia.
- swipe:
    from:
      id: roteiro-lugar-${PLACE_3_SLUG}
    direction: UP
    duration: 1500
- assertVisible:
    id: roteiro-lugar-${PLACE_3_SLUG}
