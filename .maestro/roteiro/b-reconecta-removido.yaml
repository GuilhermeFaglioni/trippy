appId: app.trippy.mobile
---
- launchApp:
    stopApp: false
- runFlow:
    file: ../subflows/alternar-offline.yaml
- openLink: trippy:///trips/${TRIP_ID}
- tapOn:
    text: Abrir
    optional: true
- extendedWaitUntil:
    visible:
      id: viagem-removida
    timeout: 60000
- assertVisible: 1 alteração não enviada
